<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - CRUD & API</title>
    <!--Importación de Tailwind CSS mediante Play CDN-->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-xl">
        <h1 class="text-3xl font-extrabold text-slate-800 mb-2 text-center">Inventario Sincronizado</h1>
        <p class="text-slate-500 text-sm text-center mb-6">Manipulación de DOM, Local Storage y Fetch API en conjunto.</p>
        
        <!--Formulario de captura de datos-->
        <div class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="inputNombre" placeholder="Nombre del producto..." 
                       class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
                <input type="number" id="inputPrecio" placeholder="Precio ($)..." 
                       class="w-full md:w-32 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm bg-white">
            </div>
            <button id="btnAgregar" class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition text-sm shadow-sm">
                Agregar Producto
            </button>
        </div>

        <!--Contenedor dinámico de alertas y mensajes-->
        <div id="contenedorMensajes" class="text-center text-sm font-medium min-h-[24px] mb-4"></div>

        <h3 class="text-lg font-bold text-slate-700 mb-3 border-b pb-2">Lista de Productos</h3>
        
        <!--Contenedor para renderizar los elementos-->
        <ul id="listaProductos" class="space-y-2.5"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
